<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>studio.e | Digital Media Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --background: #fff4f7;
            --text: #3a3033;
            --muted: #8a777c;
            --accent: #d98fa4;
            --accent-dark: #c87890;
            --accent-light: #f3d5de;
            --card: #fdecef;
            --white: #ffffff;
            --dark: #242124;
            --dark-light: #302a2d;
            --transition: 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--background);
            color: var(--text);
            font-family: "Plus Jakarta Sans", sans-serif;
            line-height: 1.6;
        }

        body.no-scroll {
            overflow: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font-family: inherit;
        }

        /* =========================
           NAVIGATION
        ========================= */

        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
            padding: 24px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 244, 247, 0.96);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-family: "Playfair Display", serif;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            position: relative;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 0;
            height: 1px;
            background: var(--accent);
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: var(--text);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .menu-button {
            display: none;
            border: 0;
            background: transparent;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 85vh;
            padding: 80px 7%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero-subtitle,
        .section-label {
            color: var(--accent-dark);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .hero-subtitle {
            margin-bottom: 18px;
        }

        .hero-title {
            max-width: 950px;
            font-family: "Playfair Display", serif;
            font-size: clamp(3rem, 7vw, 6.8rem);
            font-weight: 400;
            line-height: 1.05;
            letter-spacing: -3px;
        }

        .hero-title span {
            color: var(--accent-dark);
        }

        .hero-button {
            width: fit-content;
            margin-top: 45px;
            padding: 15px 28px;
            border: 1px solid var(--text);
            border-radius: 30px;
            background: transparent;
            color: var(--text);
            font-size: 0.8rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .hero-button:hover {
            background: var(--text);
            color: var(--white);
        }

        /* =========================
           GENERAL SECTIONS
        ========================= */

        section {
            padding: 110px 7%;
            scroll-margin-top: 90px;
        }

        .section-label {
            margin-bottom: 14px;
        }

        .section-title {
            margin-bottom: 55px;
            font-family: "Playfair Display", serif;
            font-size: clamp(2.3rem, 5vw, 4rem);
            font-weight: 400;
            line-height: 1.1;
        }

        .section-title span {
            color: var(--accent-dark);
        }

        /* =========================
           WORK
        ========================= */

        .work-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .card {
            overflow: hidden;
            background: var(--card);
            transition: transform var(--transition);
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .card-image {
            position: relative;
            height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .image-one {
            background: #fbe8ed;
        }

        .image-two {
            background: #fdedf1;
        }

        .image-three {
            background: #f8e1e8;
        }

        .card-image::after {
            content: "VIEW PROJECT";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(58, 48, 51, 0.78);
            color: var(--white);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 2px;
            opacity: 0;
            transition: var(--transition);
        }

        .card:hover .card-image::after {
            opacity: 1;
        }

        .card-content {
            padding: 28px 25px 32px;
        }

        .card-tag {
            margin-bottom: 8px;
            color: var(--accent-dark);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .card-title {
            margin-bottom: 12px;
            font-family: "Playfair Display", serif;
            font-size: 1.7rem;
            font-weight: 500;
        }

        .card-description {
            color: var(--muted);
            font-size: 0.85rem;
            line-height: 1.8;
        }

        /* =========================
           ABOUT
        ========================= */

        .about {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 100px;
            align-items: start;
        }

        .about-title {
            font-family: "Playfair Display", serif;
            font-size: clamp(2.3rem, 5vw, 4.2rem);
            font-weight: 400;
            line-height: 1.1;
        }

        .about-title span {
            color: var(--accent-dark);
        }

        .about-text {
            max-width: 650px;
            color: var(--muted);
            font-size: 1rem;
            line-height: 2;
        }

        .about-text p {
            margin-bottom: 25px;
        }

        .about-highlight {
            color: var(--text);
            font-weight: 500;
        }

        /* =========================
           CONTENT & RESEARCH
        ========================= */

        #content {
            background: #fff9fa;
        }

        .research-intro {
            max-width: 780px;
            margin-bottom: 50px;
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.9;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1px;
            background: rgba(58, 48, 51, 0.12);
            border: 1px solid rgba(58, 48, 51, 0.12);
        }

        .content-item {
            position: relative;
            padding: 40px 35px;
            background: var(--background);
            transition: var(--transition);
        }

        .content-item:hover {
            background: var(--card);
        }

        .content-number {
            display: block;
            margin-bottom: 20px;
            color: var(--accent-dark);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .content-item h3 {
            margin-bottom: 14px;
            font-family: "Playfair Display", serif;
            font-size: 1.6rem;
            font-weight: 500;
        }

        .content-item p {
            max-width: 600px;
            color: var(--muted);
            font-size: 0.85rem;
            line-height: 1.8;
        }

        /* =========================
           SURVEY RESULTS
        ========================= */

        .survey-section {
            margin-top: 80px;
        }

        .survey-heading {
            margin-bottom: 12px;
            font-family: "Playfair Display", serif;
            font-size: 2.2rem;
            font-weight: 400;
        }

        .survey-description {
            margin-bottom: 35px;
            color: var(--muted);
            font-size: 0.85rem;
        }

        .survey-card {
            padding: 35px;
            background: var(--card);
            border: 1px solid rgba(58, 48, 51, 0.1);
        }

        .survey-total {
            margin-bottom: 30px;
            color: var(--text);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .result-row {
            margin-bottom: 25px;
        }

        .result-label {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 8px;
            font-size: 0.82rem;
        }

        .result-name {
            font-weight: 500;
        }

        .result-percent {
            color: var(--accent-dark);
            font-weight: 600;
        }

        .result-track {
            width: 100%;
            height: 10px;
            overflow: hidden;
            border-radius: 20px;
            background: var(--white);
        }

        .result-bar {
            height: 100%;
            border-radius: 20px;
            background: var(--accent);
        }

        .chosen-content {
            margin-top: 35px;
            padding: 28px;
            border-left: 3px solid var(--accent);
            background: rgba(255, 255, 255, 0.55);
        }

        .chosen-content strong {
            display: block;
            margin-bottom: 8px;
            font-family: "Playfair Display", serif;
            font-size: 1.4rem;
        }

        .chosen-content p {
            color: var(--muted);
            font-size: 0.85rem;
            line-height: 1.8;
        }

        /* =========================
           PLATFORMS
        ========================= */

        .platform-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .platform-card {
            padding: 30px;
            background: var(--background);
            border: 1px solid rgba(58, 48, 51, 0.1);
            transition: var(--transition);
        }

        .platform-card:hover {
            transform: translateY(-5px);
            background: var(--card);
        }

        .platform-number {
            color: var(--accent-dark);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .platform-card h4 {
            margin: 12px 0 8px;
            font-family: "Playfair Display", serif;
            font-size: 1.5rem;
            font-weight: 500;
        }

        .platform-card p {
            color: var(--muted);
            font-size: 0.8rem;
            line-height: 1.7;
        }

        /* =========================
           CONTACT
        ========================= */

        .contact {
            padding: 150px 7%;
            text-align: center;
        }

        .contact-title {
            margin-bottom: 25px;
            font-family: "Playfair Display", serif;
            font-size: clamp(2.8rem, 6vw, 5.5rem);
            font-weight: 400;
        }

        .contact-description {
            margin-bottom: 35px;
            color: var(--muted);
        }

        .contact-button {
            display: inline-block;
            padding: 16px 32px;
            border-radius: 30px;
            background: var(--accent);
            color: var(--white);
            font-size: 0.8rem;
            font-weight: 600;
            transition: var(--transition);
        }

        .contact-button:hover {
            background: var(--accent-dark);
            transform: translateY(-3px);
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            padding: 35px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(58, 48, 51, 0.12);
            color: var(--muted);
            font-size: 0.75rem;
        }

        .footer-logo {
            color: var(--text);
            font-family: "Playfair Display", serif;
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* =========================
           CODE MODAL
        ========================= */

        .code-modal {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background: rgba(58, 48, 51, 0.55);
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .code-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .code-window {
            width: min(1000px, 100%);
            max-height: 85vh;
            overflow: hidden;
            border-radius: 12px;
            background: var(--dark);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.2);
            transform: translateY(20px);
            transition: var(--transition);
        }

        .code-modal.active .code-window {
            transform: translateY(0);
        }

        .code-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: var(--dark-light);
            color: var(--white);
        }

        .code-title {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .code-close {
            border: 0;
            background: transparent;
            color: var(--white);
            font-size: 1.4rem;
            cursor: pointer;
        }

        .code-content {
            max-height: calc(85vh - 55px);
            overflow: auto;
            padding: 25px;
            color: #f7eef1;
            font-family: monospace;
            font-size: 0.78rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* =========================
           TABLET
        ========================= */

        @media (max-width: 900px) {

            .work-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .about {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .platform-grid {
                grid-template-columns: 1fr;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 650px) {

            .navbar {
                padding: 20px 6%;
            }

            .menu-button {
                display: block;
            }

            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                display: none;
                flex-direction: column;
                gap: 25px;
                padding: 30px 6%;
                background: var(--background);
                border-top: 1px solid rgba(58, 48, 51, 0.08);
            }

            .nav-links.active {
                display: flex;
            }

            .hero {
                min-height: 75vh;
                padding: 60px 6%;
            }

            .hero-title {
                letter-spacing: -2px;
            }

            section {
                padding: 80px 6%;
            }

            .work-grid,
            .content-grid {
                grid-template-columns: 1fr;
            }

            .card-image {
                height: 300px;
            }

            .content-item {
                padding: 30px 25px;
            }

            .survey-card {
                padding: 25px;
            }

            .result-label {
                font-size: 0.75rem;
            }

            .contact {
                padding: 100px 6%;
            }

            footer {
                padding: 30px 6%;
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            .code-modal {
                padding: 12px;
            }

            .code-window {
                max-height: 90vh;
            }

            .code-content {
                max-height: calc(90vh - 55px);
                padding: 18px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================= -->

    <nav class="navbar">

        <a href="#" class="logo" id="logo">
            studio.e
        </a>

        <button
            class="menu-button"
            id="menuButton"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
        >
            ☰
        </button>

        <ul class="nav-links" id="navLinks">

            <li><a href="#work">Work</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#content">Research</a></li>
            <li><a href="#contact">Contact</a></li>

            <li><a href="#" data-code="css">CSS</a></li>
            <li><a href="#" data-code="html">HTML</a></li>
            <li><a href="#" data-code="javascript">JavaScript</a></li>

        </ul>

    </nav>


    <main>

        <!-- =========================
             HERO
        ========================= -->

        <section class="hero">

            <p class="hero-subtitle">
                Digital Media Creator
            </p>

            <h1 class="hero-title">
                Creating
                <span>entertaining content</span>
                and making every experience fun for everyone.
            </h1>

            <a href="#work" class="hero-button">
                Explore Work
            </a>

        </section>
